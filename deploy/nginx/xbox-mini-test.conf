# The test server's old host (installed by scripts/provision.sh as
# /etc/nginx/sites-enabled/xbox-mini-test). Its OAuth callback is on the prod
# host, /auth/callback-test.
server {
    server_name test.xbox.sultanpharm.com;

    location /api/mini/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app moved to test.unlocked.how (#237). The API stays for a client
    # open mid-session.
    location /app {
        return 301 https://test.unlocked.how$request_uri;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xbox.sultanpharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xbox.sultanpharm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name test.xbox.sultanpharm.com;
    listen 80;
    return 301 https://$host$request_uri;
}
