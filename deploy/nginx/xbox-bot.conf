# Prod's old host: the redirect to the app, its API and the OAuth callbacks
# (installed by scripts/provision.sh as /etc/nginx/sites-enabled/xbox-bot).
server {
    server_name xbox.sultanpharm.com;

    # Dev bots run on the developers' own machines: the browser that finished
    # the Microsoft login is sent back to that same machine (2026-09-30).
    location = /auth/callback-dev {
        add_header Cache-Control "no-store" always;
        return 302 http://127.0.0.1:8081/auth/callback-dev$is_args$args;
    }

    location = /auth/callback-dev-kreal {
        add_header Cache-Control "no-store" always;
        return 302 http://127.0.0.1:8081/auth/callback-dev-kreal$is_args$args;
    }

    location = /auth/callback-test {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/mini/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app moved to unlocked.how (#237). The API stays for a client open
    # mid-session, the callbacks for the addresses Microsoft still has.
    location /app {
        return 301 https://unlocked.how$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xbox.sultanpharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xbox.sultanpharm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name xbox.sultanpharm.com;
    listen 80;
    return 301 https://$host$request_uri;
}
